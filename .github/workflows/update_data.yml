name: Daily Stock Valuation Refresh

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance

      - name: Run valuation script
        run: python fetch_and_calculate.py

      - name: Commit and push updated JSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add valuation_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update valuation data [skip ci]" && git push)
